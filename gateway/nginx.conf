
server {
    listen 8080;

    client_max_body_size 4m;

    # Frontend
    location / {
        proxy_pass http://frontend:8080;
    }

    # API
    location /api/ {
        proxy_pass http://api:3000;
    }

    # Uploaded images from MinIO
    location /storage/ {
        proxy_pass http://minio:9000/campushub/;
    }
}
